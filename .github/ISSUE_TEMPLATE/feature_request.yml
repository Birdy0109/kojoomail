name: 功能建议 Feature request
description: 想要一个新功能或改进 / Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么麻烦 / What problem are you trying to solve
      description: 先说场景和麻烦，比直接说「加个按钮」更容易做对 / Describe the situation first, not just the solution
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你希望怎么解决 / What you'd like
  - type: textarea
    id: alt
    attributes:
      label: 现在是怎么凑合的 / Current workaround
